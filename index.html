<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SubFrame Voice -> TV</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #090d16;
      color: #f8fafc;
      margin: 0;
      padding: 16px;
    }
    .card {
      max-width: 560px;
      margin: 0 auto;
      background: #111827;
      border: 1px solid #336359;
      border-radius: 16px;
      padding: 18px;
    }
    h2 { margin: 0 0 12px; font-size: 20px; }
    label { display: block; font-size: 13px; color: #94a3b8; margin-bottom: 6px; }
    input[type="text"] {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid #334155;
      background: #0b1120;
      color: #fff;
      font-size: 15px;
      margin-bottom: 12px;
    }
    .row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
    button {
      flex: 1;
      min-width: 110px;
      padding: 12px 14px;
      border: 0;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    #btnMic { background: #336359; color: #fff; }
    #btnStop { background: #334155; color: #e2e8f0; }
    #btnClear { background: #1e293b; color: #cbd5e1; }
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #0b1120;
      padding: 10px 12px;
      border-radius: 10px;
      margin-bottom: 12px;
      font-size: 14px;
    }
    .box {
      background: #0b1120;
      border-radius: 10px;
      padding: 12px;
      min-height: 64px;
      margin-bottom: 12px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .status { font-size: 13px; color: #6ee7b7; margin-bottom: 10px; }
    .err { color: #fca5a5; }
  </style>
</head>
<body>
  <div class="card">
    <h2>SubFrame Mobile Voice -> TV</h2>

    <label for="tvIp">IP ของทีวีในวงแลน (พอร์ต 8765)</label>
    <input id="tvIp" type="text" value="192.168.1.41" />

    <div class="row">
      <button id="btnMic">เริ่มฟังเสียง (en-US)</button>
      <button id="btnStop">หยุดฟัง</button>
      <button id="btnClear">ล้างกล่อง</button>
    </div>

    <div class="toggle-row">
      <label style="margin:0;color:#f8fafc;cursor:pointer;">
        <input id="chkAuto" type="checkbox" checked /> ส่งส่วนใหม่ขึ้นทีวีอัตโนมัติ
      </label>
      <span id="micBadge" style="font-size:12px;color:#94a3b8;">พร้อม</span>
    </div>

    <div id="status" class="status">พร้อมใช้งาน</div>

    <label>ข้อความภาษาอังกฤษที่จับได้</label>
    <div id="transcript" class="box"></div>

    <label>Log การส่งขึ้นทีวี</label>
    <div id="logBox" class="box" style="font-size:12px;color:#cbd5e1;min-height:90px;"></div>
  </div>

  <script>
    const tvIpEl = document.getElementById("tvIp");
    const chkAutoEl = document.getElementById("chkAuto");
    const micBadgeEl = document.getElementById("micBadge");
    const statusEl = document.getElementById("status");
    const transcriptEl = document.getElementById("transcript");
    const logBoxEl = document.getElementById("logBox");

    const STORAGE_KEY = "subframe_tv_ip";
    const savedIp = localStorage.getItem(STORAGE_KEY);
    if (savedIp) tvIpEl.value = savedIp;
    tvIpEl.addEventListener("change", () => localStorage.setItem(STORAGE_KEY, tvIpEl.value.trim()));

    let recognition = null;
    let listening = false;
    let isStarting = false;
    let restartTimer = null;
    let committedText = "";
    let lastSentText = "";
    let debounceTimer = null;

    function addLog(msg, isErr = false) {
      const t = new Date().toLocaleTimeString("th-TH");
      logBoxEl.innerHTML = `<div class="${isErr ? "err" : ""}">[${t}] ${msg}</div>` + logBoxEl.innerHTML;
    }

    function cleanIp(raw) {
      return (raw || "")
        .trim()
        .replace(/^https?:\/\//i, "")
        .replace(/:\d+.*$/, "")
        .replace(/\/.*$/, "");
    }

    async function sendSubtitleToTv(text) {
      const clean = (text || "").trim();
      if (!clean || clean === lastSentText) return;

      const ip = cleanIp(tvIpEl.value);
      const url = `http://${ip}:8765/subtitle`;

      try {
        const res = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=UTF-8" },
          body: JSON.stringify({ text: clean, lang: "en-US" })
        });
        if (!res.ok) {
          addLog(`ส่งไม่สำเร็จ HTTP ${res.status} (${url})`, true);
          return;
        }
        lastSentText = clean;
        statusEl.classList.remove("err");
        statusEl.textContent = `ส่งอัตโนมัติแล้ว: "${clean}"`;
        addLog(`ส่งขึ้นทีวีสำเร็จ: "${clean}"`);
      } catch (err) {
        statusEl.classList.add("err");
        statusEl.textContent = `ส่งไม่สำเร็จ: ${err.message || err}`;
        addLog(`ส่งไม่สำเร็จ (${url}): ${err.message || err}`, true);
      }
    }

    function scheduleAutoSend(text) {
      if (!chkAutoEl.checked) return;
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(() => {
        sendSubtitleToTv(text);
      }, 650);
    }

    function createRecognizer() {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) return null;

      const rec = new SR();
      rec.lang = "en-US";
      rec.interimResults = true;
      rec.continuous = false;

      rec.onstart = () => {
        isStarting = false;
        micBadgeEl.textContent = "กำลังฟัง";
        statusEl.classList.remove("err");
        statusEl.textContent = "กำลังฟังเสียงภาษาอังกฤษ (en-US)... พูดได้เลย";
      };

      rec.onresult = (event) => {
        let interim = "";
        for (let i = event.resultIndex; i < event.results.length; i++) {
          const r = event.results[i];
          const piece = r[0].transcript.trim();
          if (r.isFinal) {
            committedText = (committedText + " " + piece).trim();
            if (chkAutoEl.checked) {
              clearTimeout(debounceTimer);
              sendSubtitleToTv(piece);
            }
          } else {
            interim = (interim + " " + piece).trim();
          }
        }

        const display = (committedText + (interim ? " [" + interim + "]" : "")).trim();
        transcriptEl.textContent = display;

        if (interim && chkAutoEl.checked) {
          scheduleAutoSend(interim);
        }
      };

      rec.onerror = (e) => {
        isStarting = false;
        addLog(`Mic error: ${e.error}`, true);
        if (e.error === "not-allowed" || e.error === "service-not-allowed") {
          listening = false;
          clearTimeout(restartTimer);
          micBadgeEl.textContent = "ไมค์ถูกบล็อก";
          statusEl.classList.add("err");
          statusEl.textContent = "กรุณาอนุญาตการใช้ไมโครโฟนในเบราว์เซอร์";
        } else if (e.error === "aborted") {
          listening = false;
          clearTimeout(restartTimer);
          micBadgeEl.textContent = "ถูกยกเลิก";
          statusEl.classList.add("err");
          statusEl.textContent = "การจับเสียงถูกยกเลิก — กด 'เริ่มฟังเสียง' อีกครั้ง";
        }
      };

      rec.onend = () => {
        isStarting = false;
        if (!listening) {
          micBadgeEl.textContent = "หยุดแล้ว";
          statusEl.textContent = "หยุดฟังเสียงแล้ว";
          return;
        }
        clearTimeout(restartTimer);
        restartTimer = setTimeout(() => {
          if (listening && !isStarting) {
            safeStart(rec);
          }
        }, 350);
      };

      return rec;
    }

    function safeStart(rec) {
      if (!rec || isStarting) return;
      isStarting = true;
      try {
        rec.start();
      } catch (e) {
        isStarting = false;
        addLog("เริ่มไมค์ไม่ได้: " + (e.message || e), true);
      }
    }

    function startMic() {
      if (!window.SpeechRecognition && !window.webkitSpeechRecognition) {
        statusEl.classList.add("err");
        statusEl.textContent = "เบราว์เซอร์นี้ไม่รองรับ SpeechRecognition บนเว็บ";
        addLog("ไม่รองรับ SpeechRecognition", true);
        return;
      }

      clearTimeout(restartTimer);
      listening = true;

      if (!recognition) {
        recognition = createRecognizer();
      }
      addLog("กดเริ่มฟังเสียงภาษาอังกฤษแล้ว");
      safeStart(recognition);
    }

    function stopMic() {
      listening = false;
      isStarting = false;
      clearTimeout(restartTimer);
      clearTimeout(debounceTimer);
      if (recognition) {
        try { recognition.stop(); } catch (_) {}
      }
      micBadgeEl.textContent = "หยุดแล้ว";
      statusEl.textContent = "หยุดฟังเสียงแล้ว";
    }

    document.getElementById("btnMic").addEventListener("click", startMic);
    document.getElementById("btnStop").addEventListener("click", stopMic);
    document.getElementById("btnClear").addEventListener("click", () => {
      committedText = "";
      lastSentText = "";
      transcriptEl.textContent = "";
      addLog("ล้างข้อความในกล่องแล้ว");
    });
  </script>
</body>
</html>
